name: ML Predict

on:
  schedule:
    - cron: "0 1 * * *"  # Tiap hari jam 01:00 UTC (08:00 WIB)
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r ml-service/requirements.txt

      - name: Run ML predictions
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m ml_service.models.prophet_model

      - name: Notify on failure
        if: failure()
        run: echo "::warning::ML prediction gagal."
