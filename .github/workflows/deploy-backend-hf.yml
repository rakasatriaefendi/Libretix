name: Deploy Backend to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-hf.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config --global user.email "ci@libretix.com"
          git config --global user.name "Libretix CI"

      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Clone HF Space
          git clone https://rakabaebae:$HF_TOKEN@huggingface.co/spaces/rakabaebae/libretix-backend /tmp/hf-space

          # Keep HF structure package-based:
          # /main.py -> from backend.main import app
          # /backend/** -> actual FastAPI source
          mkdir -p /tmp/hf-space/backend

          # Remove stale flattened artifacts from older deploys.
          rm -rf /tmp/hf-space/db /tmp/hf-space/models /tmp/hf-space/routers
          rm -f /tmp/hf-space/__init__.py

          # Sync backend package only.
          rsync -av --delete --exclude='__pycache__' --exclude='*.pyc' \
            backend/ /tmp/hf-space/backend/

          # Keep root entrypoint tiny and stable for HF.
          printf 'from backend.main import app\n' > /tmp/hf-space/main.py

          # Mirror backend runtime metadata expected by the HF Space root.
          cp backend/requirements.txt /tmp/hf-space/requirements.txt
          cp backend/.env.example /tmp/hf-space/.env.example
          cp backend/Dockerfile /tmp/hf-space/Dockerfile
          cp backend/.gitattributes /tmp/hf-space/.gitattributes

          # Commit dan push
          cd /tmp/hf-space
          git add .
          git diff --cached --quiet || git commit -m "deploy: sync backend from Libretix main"
          git push https://rakabaebae:$HF_TOKEN@huggingface.co/spaces/rakabaebae/libretix-backend main

      - name: Done
        run: echo "Backend deployed to HF Spaces!"
