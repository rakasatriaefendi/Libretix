name: Scrape Stocks

on:
  schedule:
    # Tiap jam di jam bursa: 9:00-16:00 WIB (02:00-09:00 UTC) untuk IDX
    # dan 21:30-04:00 WIB (14:30-21:00 UTC) untuk US
    # Untuk simplicity, jalankan tiap jam semua hari
    - cron: "0 * * * *"
  workflow_dispatch: # Bisa trigger manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run stock scraper
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.stocks

      - name: Notify on failure
        if: failure()
        run: echo "::warning::Stock scraper gagal. Cek log di atas."
